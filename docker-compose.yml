version: "3.9"

services:
  memgraph:
    image: memgraph/memgraph-platform:latest
    ports:
      - "7687:7687"
      - "3000:3000"
    environment:
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=memgraph

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - memgraph
    volumes:
      - .:/app
