services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    ports:
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/7687'"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: g42-agentthon
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
    volumes:
      - ./logs:/app/logs
    depends_on:
      memgraph:
        condition: service_healthy
